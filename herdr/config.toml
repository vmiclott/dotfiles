onboarding = false

[keys]
prefix = "ctrl+space"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

split_vertical = "prefix+L"
split_horizontal = "prefix+J"

swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"

zoom = ["prefix+f", "prefix+z"]
copy_mode = "prefix+v"

new_tab = "prefix+c"
move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

[[keys.command]]
key = "prefix+H"
type = "shell"
description = "Split right and move the new pane to the left"
command = '''id=$("$HERDR_BIN_PATH" pane split --pane "$HERDR_ACTIVE_PANE_ID" --direction right --focus | sed -E 's/.*"pane_id":"([^"]+)".*/\1/'); [ -n "$id" ] && "$HERDR_BIN_PATH" pane swap --pane "$id" --direction left'''

[[keys.command]]
key = "prefix+K"
type = "shell"
description = "Split down and move the new pane up"
command = '''id=$("$HERDR_BIN_PATH" pane split --pane "$HERDR_ACTIVE_PANE_ID" --direction down --focus | sed -E 's/.*"pane_id":"([^"]+)".*/\1/'); [ -n "$id" ] && "$HERDR_BIN_PATH" pane swap --pane "$id" --direction up'''
